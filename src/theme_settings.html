<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <title>Mermaid themes</title>
</head>
<body>
  <form id="form">
    <div class="row">
      <label for="themeList">Theme</label>
      <select id="themeList"></select>
      <button type="button" id="newTheme">New</button>
    </div>

    <label for="themeName">Name</label>
    <input id="themeName" type="text" maxlength="60" autocomplete="off" />

    <div class="workspace">
      <div class="variables-panel">
        <label for="themeVariables">Theme variables JSON</label>
        <textarea id="themeVariables" spellcheck="false"></textarea>
      </div>

      <div class="preview-panel">
        <label for="themePreview">Preview</label>
        <div id="themePreview"></div>
      </div>
    </div>

    <div class="buttons">
      <button type="button" id="deleteTheme">Delete</button>
      <span id="status"></span>
      <button type="button" id="close">Close</button>
      <button type="submit" class="action" id="saveTheme">Save</button>
    </div>
  </form>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    const SAMPLE_VARIABLES = {
      primaryColor: '#f6d365',
      primaryTextColor: '#1f2933',
      primaryBorderColor: '#2563eb',
      lineColor: '#2563eb',
      secondaryColor: '#dbeafe',
      tertiaryColor: '#f8fafc',
      fontFamily: 'Arial',
      fontSize: '14px',
    };
    const PREVIEW_GRAPH = `graph LR
  A[Start] --> B{Choice}
  B -->|One| C[Result one]
  B -->|Two| D[Result two]`;

    const byId = id => document.getElementById(id);
    let themeConfig = normalizeThemeConfig(window.mermaidThemeDataFromGoogle);
    let selectedThemeId = '';
    let previewSequence = 0;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
    });

    function normalizeThemeConfig(config) {
      return {
        customThemes: Array.isArray(config?.customThemes) ? config.customThemes : [],
      };
    }

    function callServer(functionName, ...args) {
      return new Promise((resolve, reject) => {
        if (!window.google?.script?.run) {
          reject(new Error('Google Apps Script runtime is unavailable.'));
          return;
        }

        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))))
          [functionName](...args);
      });
    }

    function setStatus(message, isError = false) {
      byId('status').textContent = message || '';
      byId('status').className = isError ? 'error' : '';
    }

    function setBusy(isBusy) {
      byId('themeList').disabled = isBusy;
      byId('newTheme').disabled = isBusy;
      byId('themeName').disabled = isBusy;
      byId('themeVariables').disabled = isBusy;
      byId('deleteTheme').disabled = isBusy || !selectedThemeId;
      byId('saveTheme').disabled = isBusy;
      byId('close').disabled = isBusy;
    }

    function debounce(fn, wait) {
      let timeoutId = null;
      return (...args) => {
        window.clearTimeout(timeoutId);
        timeoutId = window.setTimeout(() => fn(...args), wait);
      };
    }

    function refreshThemeList(nextSelectedId = selectedThemeId) {
      const list = byId('themeList');
      list.innerHTML = '';

      const blankOption = document.createElement('option');
      blankOption.value = '';
      blankOption.textContent = 'New custom theme';
      list.appendChild(blankOption);

      themeConfig.customThemes.forEach(theme => {
        const option = document.createElement('option');
        option.value = theme.id;
        option.textContent = theme.name;
        list.appendChild(option);
      });

      const hasSelected = themeConfig.customThemes.some(theme => theme.id === nextSelectedId);
      list.value = hasSelected ? nextSelectedId : '';
      selectTheme(list.value);
    }

    function selectTheme(themeId) {
      selectedThemeId = themeId || '';
      const selectedTheme = themeConfig.customThemes.find(theme => theme.id === selectedThemeId);

      if (selectedTheme) {
        byId('themeName').value = selectedTheme.name;
        byId('themeVariables').value = JSON.stringify(selectedTheme.themeVariables || {}, null, 2);
      } else {
        byId('themeName').value = '';
        byId('themeVariables').value = JSON.stringify(SAMPLE_VARIABLES, null, 2);
      }

      byId('deleteTheme').disabled = !selectedThemeId;
      setStatus('');
      renderPreview();
    }

    function parseThemeVariables() {
      const rawVariables = byId('themeVariables').value.trim();
      if (!rawVariables) {
        return {};
      }

      let parsed;
      try {
        parsed = JSON.parse(rawVariables);
      } catch (error) {
        throw new Error('Theme variables must be valid JSON.');
      }

      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        throw new Error('Theme variables must be a JSON object.');
      }

      return parsed;
    }

    async function renderPreview() {
      const previewNode = byId('themePreview');
      const renderId = `theme-settings-preview-${++previewSequence}`;
      const currentSequence = previewSequence;

      try {
        const themeVariables = parseThemeVariables();
        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          themeVariables,
        });

        const { svg } = await mermaid.render(renderId, PREVIEW_GRAPH);
        if (currentSequence !== previewSequence) {
          return;
        }

        previewNode.className = '';
        previewNode.innerHTML = svg;
        const svgElement = previewNode.querySelector('svg');
        if (svgElement) {
          svgElement.removeAttribute('height');
          svgElement.style.maxWidth = '100%';
          svgElement.style.height = 'auto';
        }
      } catch (error) {
        if (currentSequence !== previewSequence) {
          return;
        }

        previewNode.className = 'preview-error';
        previewNode.textContent = error.message || String(error);
      }
    }

    const renderPreviewDebounced = debounce(renderPreview, 180);

    async function handleSave(event) {
      event.preventDefault();

      setBusy(true);
      try {
        setStatus('Saving...');
        const result = await callServer('saveMermaidCustomTheme', {
          id: selectedThemeId,
          name: byId('themeName').value,
          themeVariables: parseThemeVariables(),
        });

        themeConfig = normalizeThemeConfig(result?.config || result);
        refreshThemeList(result?.savedTheme?.id || selectedThemeId);
        setStatus('Saved.');
      } catch (error) {
        setStatus(error.message || String(error), true);
      } finally {
        setBusy(false);
      }
    }

    async function handleDelete() {
      if (!selectedThemeId) {
        return;
      }

      setBusy(true);
      try {
        setStatus('Deleting...');
        themeConfig = normalizeThemeConfig(await callServer('deleteMermaidCustomTheme', selectedThemeId));
        refreshThemeList('');
        setStatus('Deleted.');
      } catch (error) {
        setStatus(error.message || String(error), true);
      } finally {
        setBusy(false);
      }
    }

    byId('form').addEventListener('submit', handleSave);
    byId('themeList').addEventListener('change', event => selectTheme(event.target.value));
    byId('newTheme').addEventListener('click', () => {
      byId('themeList').value = '';
      selectTheme('');
      byId('themeName').focus();
    });
    byId('deleteTheme').addEventListener('click', handleDelete);
    byId('themeVariables').addEventListener('input', renderPreviewDebounced);
    byId('close').addEventListener('click', () => {
      if (window.google?.script?.host) {
        window.google.script.host.close();
      }
    });

    refreshThemeList('');
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      color: #202124;
      font: 13px/1.4 Arial, sans-serif;
    }

    #form {
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      row-gap: 6px;
      column-gap: 10px;
      height: 100%;
      padding: 18px;
    }

    .row,
    .buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row label {
      margin: 0;
    }

    label {
      font-weight: 600;
    }

    #themeList {
      flex: 1 1 auto;
      min-width: 0;
    }

    #themeName {
      box-sizing: border-box;
      width: 100%;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(260px, 0.72fr) minmax(420px, 1.65fr);
      gap: 10px;
      margin-top: -6px;
      min-height: 0;
    }

    .variables-panel,
    .preview-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      min-width: 0;
      min-height: 0;
    }

    #themeVariables {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      min-height: 300px;
      resize: none;
      font: 13px/1.5 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    #themePreview {
      box-sizing: border-box;
      display: grid;
      place-items: center;
      min-height: 300px;
      overflow: auto;
      border: 1px solid #dadce0;
      background: #fff;
      padding: 16px;
    }

    #themePreview svg {
      max-width: 100%;
      width: 100%;
      min-width: 420px;
    }

    #themePreview.preview-error {
      place-items: start;
      color: #b3261e;
      font: 13px/1.45 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      white-space: pre-wrap;
    }

    .buttons {
      justify-content: flex-end;
    }

    #status {
      flex: 1 1 auto;
      color: #188038;
      min-height: 18px;
    }

    #status.error {
      color: #b3261e;
    }
  </style>
</body>
</html>

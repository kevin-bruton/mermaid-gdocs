<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <title>Mermaid themes</title>
</head>
<body>
  <form id="form">
    <div class="row">
      <label for="themeList">Theme</label>
      <select id="themeList"></select>
      <button type="button" id="newTheme">New</button>
    </div>

    <label for="themeName">Name</label>
    <input id="themeName" type="text" maxlength="60" autocomplete="off" />

    <div class="workspace">
      <div class="variables-panel">
        <label for="themeVariables">Theme variables JSON</label>
        <textarea id="themeVariables" spellcheck="false"></textarea>
      </div>

      <div class="preview-panel">
        <label for="themePreview">Preview</label>
        <div id="themePreview"></div>
      </div>
    </div>

    <div class="buttons">
      <button type="button" id="deleteTheme">Delete</button>
      <span id="status"></span>
      <button type="button" id="close">Close</button>
      <button type="submit" class="action" id="saveTheme">Save</button>
    </div>
  </form>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    const SAMPLE_VARIABLES = {
      primaryColor: '#f6d365',
      primaryTextColor: '#1f2933',
      primaryBorderColor: '#2563eb',
      lineColor: '#2563eb',
      secondaryColor: '#dbeafe',
      tertiaryColor: '#f8fafc',
      fontFamily: 'Arial',
      fontSize: '14px',
    };
    const PREVIEW_GRAPH = `graph TD
  A["<b>Primary</b><br/>Node"] --> B{Decision}
  B -->|Path 1| C["Secondary<br/>Node"]
  B -->|Path 2| D[("Tertiary<br/>Node")]
  C -.->|Dotted| Theme
  D --> Theme
  subgraph Theme["Color Showcase"]
    G["Node 1"]
  end`;

    const byId = id => document.getElementById(id);
    let themeConfig = normalizeThemeConfig(window.mermaidThemeDataFromGoogle);
    let selectedThemeId = '';
    let previewSequence = 0;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
    });

    function normalizeThemeConfig(config) {
      return {
        customThemes: Array.isArray(config?.customThemes) ? config.customThemes : [],
      };
    }

    function callServer(functionName, ...args) {
      return new Promise((resolve, reject) => {
        if (!window.google?.script?.run) {
          reject(new Error('Google Apps Script runtime is unavailable.'));
          return;
        }

        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))))
          [functionName](...args);
      });
    }

    function setStatus(message, isError = false) {
      byId('status').textContent = message || '';
      byId('status').className = isError ? 'error' : '';
    }

    function setBusy(isBusy) {
      byId('themeList').disabled = isBusy;
      byId('newTheme').disabled = isBusy;
      byId('themeName').disabled = isBusy;
      byId('themeVariables').disabled = isBusy;
      byId('deleteTheme').disabled = isBusy || !selectedThemeId;
      byId('saveTheme').disabled = isBusy;
      byId('close').disabled = isBusy;
    }

    function debounce(fn, wait) {
      let timeoutId = null;
      return (...args) => {
        window.clearTimeout(timeoutId);
        timeoutId = window.setTimeout(() => fn(...args), wait);
      };
    }

    function refreshThemeList(nextSelectedId = selectedThemeId) {
      const list = byId('themeList');
      list.innerHTML = '';

      const blankOption = document.createElement('option');
      blankOption.value = '';
      blankOption.textContent = 'New custom theme';
      list.appendChild(blankOption);

      themeConfig.customThemes.forEach(theme => {
        const option = document.createElement('option');
        option.value = theme.id;
        option.textContent = theme.name;
        list.appendChild(option);
      });

      const hasSelected = themeConfig.customThemes.some(theme => theme.id === nextSelectedId);
      list.value = hasSelected ? nextSelectedId : '';
      selectTheme(list.value);
    }

    function selectTheme(themeId) {
      selectedThemeId = themeId || '';
      const selectedTheme = themeConfig.customThemes.find(theme => theme.id === selectedThemeId);

      if (selectedTheme) {
        byId('themeName').value = selectedTheme.name;
        byId('themeVariables').value = JSON.stringify(selectedTheme.themeVariables || {}, null, 2);
      } else {
        byId('themeName').value = '';
        byId('themeVariables').value = JSON.stringify(SAMPLE_VARIABLES, null, 2);
      }

      byId('deleteTheme').disabled = !selectedThemeId;
      setStatus('');
      renderPreview();
    }

    function parseThemeVariables() {
      const rawVariables = byId('themeVariables').value.trim();
      if (!rawVariables) {
        return {};
      }

      let parsed;
      try {
        parsed = JSON.parse(rawVariables);
      } catch (error) {
        throw new Error('Theme variables must be valid JSON.');
      }

      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        throw new Error('Theme variables must be a JSON object.');
      }

      return parsed;
    }

    async function renderPreview() {
      const previewNode = byId('themePreview');
      const renderId = `theme-settings-preview-${++previewSequence}`;
      const currentSequence = previewSequence;

      try {
        const themeVariables = parseThemeVariables();
        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          themeVariables,
        });

        const { svg } = await mermaid.render(renderId, PREVIEW_GRAPH);
        if (currentSequence !== previewSequence) {
          return;
        }

        previewNode.className = '';
        
        // Create a container for the graph and color guide
        const container = document.createElement('div');
        container.style.width = '100%';
        container.style.height = '100%';
        container.style.display = 'flex';
        container.style.flexDirection = 'column';
        container.style.gap = '12px';
        container.style.overflow = 'hidden';
        
        // Graph container with size constraint
        const graphContainer = document.createElement('div');
        graphContainer.style.minWidth = '0';
        graphContainer.style.minHeight = '0';
        graphContainer.style.flex = '1';
        graphContainer.style.display = 'flex';
        graphContainer.style.justifyContent = 'center';
        graphContainer.style.alignItems = 'center';
        graphContainer.style.overflow = 'hidden';
        graphContainer.innerHTML = svg;
        container.appendChild(graphContainer);
        
        const svgElement = graphContainer.querySelector('svg');
        if (svgElement) {
          svgElement.removeAttribute('height');
          svgElement.removeAttribute('width');
          svgElement.style.maxWidth = '100%';
          svgElement.style.maxHeight = '100%';
          svgElement.style.height = 'auto';
          svgElement.style.width = 'auto';
        }
        
        // Color guide
        const colorGuide = document.createElement('div');
        colorGuide.style.borderTop = '1px solid #dadce0';
        colorGuide.style.paddingTop = '8px';
        colorGuide.style.fontSize = '12px';
        
        const colorInfo = [];
        if (themeVariables.primaryColor) colorInfo.push(['Primary', themeVariables.primaryColor]);
        if (themeVariables.secondaryColor) colorInfo.push(['Secondary', themeVariables.secondaryColor]);
        if (themeVariables.tertiaryColor) colorInfo.push(['Tertiary', themeVariables.tertiaryColor]);
        if (themeVariables.primaryBorderColor) colorInfo.push(['Border', themeVariables.primaryBorderColor]);
        if (themeVariables.lineColor) colorInfo.push(['Line', themeVariables.lineColor]);
        if (themeVariables.primaryTextColor) colorInfo.push(['Text', themeVariables.primaryTextColor]);
        if (themeVariables.fontFamily) colorInfo.push(['Font', themeVariables.fontFamily]);
        if (themeVariables.fontSize) colorInfo.push(['Size', themeVariables.fontSize]);
        
        const swatchGrid = document.createElement('div');
        swatchGrid.style.display = 'grid';
        swatchGrid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(140px, 1fr))';
        swatchGrid.style.gap = '8px';
        
        colorInfo.forEach(([label, value]) => {
          const swatch = document.createElement('div');
          swatch.style.display = 'flex';
          swatch.style.alignItems = 'center';
          swatch.style.gap = '6px';
          
          if (label === 'Font' || label === 'Size') {
            const textBox = document.createElement('div');
            textBox.style.width = '24px';
            textBox.style.height = '24px';
            textBox.style.border = '1px solid #dadce0';
            textBox.style.display = 'flex';
            textBox.align = 'center';
            textBox.style.justifyContent = 'center';
            textBox.style.fontSize = '10px';
            textBox.style.fontWeight = 'bold';
            textBox.textContent = 'A';
            if (label === 'Font') textBox.style.fontFamily = value;
            swatch.appendChild(textBox);
          } else {
            const colorBox = document.createElement('div');
            colorBox.style.width = '24px';
            colorBox.style.height = '24px';
            colorBox.style.backgroundColor = value;
            colorBox.style.border = '1px solid #dadce0';
            colorBox.style.borderRadius = '2px';
            swatch.appendChild(colorBox);
          }
          
          const info = document.createElement('div');
          info.style.flex = '1';
          info.style.minWidth = '0';
          const labelElem = document.createElement('div');
          labelElem.style.fontWeight = '600';
          labelElem.style.fontSize = '12px';
          labelElem.textContent = label;
          const valueElem = document.createElement('div');
          valueElem.style.fontSize = '11px';
          valueElem.style.color = '#5f6368';
          valueElem.style.wordBreak = 'break-all';
          valueElem.style.overflow = 'hidden';
          valueElem.textContent = value;
          info.appendChild(labelElem);
          info.appendChild(valueElem);
          swatch.appendChild(info);
          
          swatchGrid.appendChild(swatch);
        });
        
        colorGuide.appendChild(swatchGrid);
        container.appendChild(colorGuide);
        
        previewNode.innerHTML = '';
        previewNode.appendChild(container);
      } catch (error) {
        if (currentSequence !== previewSequence) {
          return;
        }

        previewNode.className = 'preview-error';
        previewNode.textContent = error.message || String(error);
      }
    }

    const renderPreviewDebounced = debounce(renderPreview, 180);

    async function handleSave(event) {
      event.preventDefault();

      setBusy(true);
      try {
        setStatus('Saving...');
        const result = await callServer('saveMermaidCustomTheme', {
          id: selectedThemeId,
          name: byId('themeName').value,
          themeVariables: parseThemeVariables(),
        });

        themeConfig = normalizeThemeConfig(result?.config || result);
        refreshThemeList(result?.savedTheme?.id || selectedThemeId);
        setStatus('Saved.');
      } catch (error) {
        setStatus(error.message || String(error), true);
      } finally {
        setBusy(false);
      }
    }

    async function handleDelete() {
      if (!selectedThemeId) {
        return;
      }

      setBusy(true);
      try {
        setStatus('Deleting...');
        themeConfig = normalizeThemeConfig(await callServer('deleteMermaidCustomTheme', selectedThemeId));
        refreshThemeList('');
        setStatus('Deleted.');
      } catch (error) {
        setStatus(error.message || String(error), true);
      } finally {
        setBusy(false);
      }
    }

    byId('form').addEventListener('submit', handleSave);
    byId('themeList').addEventListener('change', event => selectTheme(event.target.value));
    byId('newTheme').addEventListener('click', () => {
      byId('themeList').value = '';
      selectTheme('');
      byId('themeName').focus();
    });
    byId('deleteTheme').addEventListener('click', handleDelete);
    byId('themeVariables').addEventListener('input', renderPreviewDebounced);
    byId('close').addEventListener('click', () => {
      if (window.google?.script?.host) {
        window.google.script.host.close();
      }
    });

    refreshThemeList('');
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      color: #202124;
      font: 13px/1.4 Arial, sans-serif;
    }

    #form {
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      row-gap: 6px;
      column-gap: 10px;
      height: 100%;
      padding: 18px;
    }

    .row,
    .buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row label {
      margin: 0;
    }

    label {
      font-weight: 600;
    }

    #themeList {
      flex: 1 1 auto;
      min-width: 0;
    }

    #themeName {
      box-sizing: border-box;
      width: 100%;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(260px, 0.72fr) minmax(420px, 1.65fr);
      gap: 10px;
      margin-top: -6px;
      min-height: 0;
    }

    .variables-panel,
    .preview-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      min-width: 0;
      min-height: 0;
    }

    #themeVariables {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      min-height: 300px;
      resize: none;
      font: 13px/1.5 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    #themePreview {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 300px;
      overflow: hidden;
      border: 1px solid #dadce0;
      background: #fff;
      padding: 16px;
    }

    #themePreview svg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }

    #themePreview.preview-error {
      place-items: start;
      color: #b3261e;
      font: 13px/1.45 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      white-space: pre-wrap;
    }

    .buttons {
      justify-content: flex-end;
    }

    #status {
      flex: 1 1 auto;
      color: #188038;
      min-height: 18px;
    }

    #status.error {
      color: #b3261e;
    }
  </style>
</body>
</html>

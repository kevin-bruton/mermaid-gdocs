<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">

    <title>Mermaid google docs</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧜‍♀️</text></svg>">

</head>
<body>
<form id="form">

        <label for="code" id="codelabel">Source code of your graph</label>
        <a id="help" href="https://mermaid.js.org/intro/" target="_blank">Help</a>
        <textarea id="code"></textarea>
        <select id="theme" >
            <option value="default">default theme</option>
            <option value="forest">Forest theme</option>
            <option value="dark">dark theme</option>
            <option value="neutral">neutral theme</option>
        </select>

        <div id="frameControls" class="frame-controls">
            <label for="frameBorderWidth">Border</label>
            <input id="frameBorderWidth" type="number" min="0" max="24" step="1" value="1" />
            <label for="frameBorderColor">Color</label>
            <input id="frameBorderColor" type="color" value="#000000" />
            <label for="framePadding">Padding</label>
            <input id="framePadding" type="number" min="0" max="64" step="1" value="0" />
        </div>

        <pre id="preview"></pre>
        <div class="buttons">
            <button id="cancel">Cancel</button>
            <button class="action" type="submit" id="submit">Insert</button>
        </div>
<div id="info">

</div>
</form>


<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    const DOC_MAX_DIMENSION = 1600;
    const MAX_RASTER_DIMENSION = 1600;
    const EXPORT_QUALITY_MULTIPLIER = 2;

    const FRAME_DEFAULTS = {
        borderWidth: 1,
        borderColor: '#000000',
        padding: 0,
    };

    const IMAGE_FRAME = {
        ...FRAME_DEFAULTS,
    };

    function getDocumentImageMaxWidth() {
        const maxWidth = Number(window.graphDataFromGoogle?.maxImageWidth);
        return Number.isFinite(maxWidth) && maxWidth > 0
            ? Math.floor(maxWidth)
            : DOC_MAX_DIMENSION;
    }


    function debounce(func, wait, immediate) {
        var timeout;
        return function () {
            var context = this,
                args = arguments;
            var later = function () {
                timeout = null;
                if (!immediate) func.apply(context, args);
            };
            var callNow = immediate && !timeout;
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
            if (callNow) func.apply(context, args);
        };
    }

    function getScaling(mySVG, targetTotalWidth = 0){

            const frameConfig = sanitizeFrameConfig(IMAGE_FRAME);
            const frameWidth = frameConfig.borderWidth + frameConfig.padding;
            const {width,height}=mySVG.getBoundingClientRect()
            const safeWidth = Math.max(width, 1);
            const safeHeight = Math.max(height, 1);
            const maxTotalDocWidth = Math.max(1, Math.min(DOC_MAX_DIMENSION, getDocumentImageMaxWidth()));
            const maxContentDocWidth = Math.max(1, maxTotalDocWidth - frameWidth * 2);
            const maxContentDocHeight = Math.max(1, DOC_MAX_DIMENSION - frameWidth * 2);
            let displayScaling = Math.min(1, maxContentDocWidth / safeWidth, maxContentDocHeight / safeHeight);

            if (targetTotalWidth > 0 && width > 0) {
                const targetWidth = Math.min(targetTotalWidth, maxTotalDocWidth);
                const targetContentWidth = Math.max(1, targetWidth - frameWidth * 2);
                displayScaling = Math.min(targetContentWidth / safeWidth, maxContentDocWidth / safeWidth, maxContentDocHeight / safeHeight);
            }

            const DocElWidth = width * displayScaling + frameWidth * 2;
            const DocElHeight = height * displayScaling + frameWidth * 2;
            const maxDocDim = Math.max(DocElWidth, DocElHeight, 1);
            const qualityScaling = Math.max(1, Math.min(EXPORT_QUALITY_MULTIPLIER, MAX_RASTER_DIMENSION / maxDocDim));
            const superScaling = displayScaling * qualityScaling;



            return {width,height,superScaling,
                // Size recommendation for the image in the doc
                DocElWidth,
                DocElHeight,
                displayScaling,
                qualityScaling,
                frameConfig,
                frameWidth,
                maxTotalDocWidth,
            }
    }

    function drawImageFrame(ctx, canvasWidth, canvasHeight, frameConfig, qualityScaling) {
        const borderWidth = frameConfig.borderWidth * qualityScaling;
        if (!borderWidth) {
            return;
        }

        ctx.fillStyle = frameConfig.borderColor;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
        ctx.clearRect(
            borderWidth,
            borderWidth,
            Math.max(0, canvasWidth - borderWidth * 2),
            Math.max(0, canvasHeight - borderWidth * 2)
        );
    }

    function svgAsPng(mySVG, cb, targetTotalWidth = 0) {

            var can = document.createElement('canvas'), // Not shown on page
                ctx = can.getContext('2d'),
                loader = new Image(); // Not shown on page
            const {width,height,superScaling, DocElWidth, DocElHeight, qualityScaling, frameConfig, frameWidth} = getScaling(mySVG, targetTotalWidth)
        mySVG.setAttribute('width', width)
        mySVG.setAttribute('height', height)

            const contentWidthPx = width * superScaling;
            const contentHeightPx = height * superScaling;
            const frameOffsetPx = frameWidth * qualityScaling;

            can.width = Math.max(1, Math.round(DocElWidth * qualityScaling));
            can.height = Math.max(1, Math.round(DocElHeight * qualityScaling));
            loader.onload = function () {
                // console.log('image loaded',loader, 0, 0, loader.width, loader.height, 0,0,can.width,can.height)

                drawImageFrame(ctx, can.width, can.height, frameConfig, qualityScaling);
                ctx.drawImage(loader, 0, 0, loader.width, loader.height, frameOffsetPx, frameOffsetPx, contentWidthPx, contentHeightPx);

                cb(can.toDataURL(), DocElWidth,DocElHeight);
            };
            var svgAsXML = new XMLSerializer().serializeToString(mySVG);
            loader.src = 'data:image/svg+xml,' + encodeURIComponent(svgAsXML);
        }


    function byId(id) {
        let res = document.getElementById(id);
        if (!res) console.log('no result for id ' + id);
        return res;
    }

    function callServer(functionName, ...args) {
        return new Promise((resolve, reject) => {
            if (!window.google?.script?.run) {
                resolve(null);
                return;
            }

            window.google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))))
                [functionName](...args);
        });
    }

    function sanitizeFrameConfig(config = {}) {
        const borderWidth = Number.isFinite(Number(config.borderWidth))
            ? Math.max(0, Math.min(24, Math.round(Number(config.borderWidth))))
            : FRAME_DEFAULTS.borderWidth;
        const padding = Number.isFinite(Number(config.padding))
            ? Math.max(0, Math.min(64, Math.round(Number(config.padding))))
            : FRAME_DEFAULTS.padding;
        const borderColor = /^#[0-9a-fA-F]{6}$/.test(String(config.borderColor || '').trim())
            ? String(config.borderColor).toLowerCase()
            : FRAME_DEFAULTS.borderColor;

        return {
            borderWidth,
            borderColor,
            padding,
        };
    }

    function applyFrameConfig(config = {}) {
        const safe = sanitizeFrameConfig(config);
        Object.assign(IMAGE_FRAME, safe);

        byId('frameBorderWidth').value = String(safe.borderWidth);
        byId('frameBorderColor').value = safe.borderColor;
        byId('framePadding').value = String(safe.padding);
    }

    function getFrameConfigFromInputs() {
        return sanitizeFrameConfig({
            borderWidth: byId('frameBorderWidth').value,
            borderColor: byId('frameBorderColor').value,
            padding: byId('framePadding').value,
        });
    }

    async function persistFrameConfig() {
        const config = getFrameConfigFromInputs();
        applyFrameConfig(config);
        await callServer('setImageFrameConfig', {
            borderWidth: config.borderWidth,
            borderColor: config.borderColor,
            padding: config.padding,
        });
    }

    let theme = '';
    const renderPreview = debounce(async function () {

        var source = byId('code').value.trim();

        try {
            await mermaid.parse(source);
            byId('preview').setAttribute('data-processed', '');
            byId('preview').textContent = source;

            await mermaid.initialize({
                startOnLoad: false,
                theme,
            });
            await mermaid.init(undefined, byId('preview'));
            const svg=document.getElementsByTagName('svg')[0]
            // It's quite odd, the max width must be set by mermaid, and interacts oddly with display grid in ff
            if(svg.style.maxWidth){
                svg.style.width=svg.style.maxWidth
            }


            byId('preview').style.paddingLeft=Math.round(Math.max(0, (byId('preview').getBoundingClientRect().width -svg.getBoundingClientRect().width)/2 ))+'px'
            byId('preview').style.paddingTop=Math.round(Math.max(0, (byId('preview').getBoundingClientRect().height -svg.getBoundingClientRect().height)/2 ))+'px';



            const {width,height,displayScaling, DocElWidth, DocElHeight, maxTotalDocWidth} = getScaling(svg)

            byId('submit').disabled = false
            if(displayScaling>=0.999){
                byId('info').innerHTML = `Your graph is ${Math.round(width)} x ${Math.round(height)} px. It will be inserted no wider than ${Math.round(maxTotalDocWidth)}px.`
                byId('submit').textContent= 'Insert'
                byId('submit').className= 'blue'
            }else{

                byId('info').innerHTML = `Your graph is ${Math.round(width)} x ${Math.round(height)} px. It will be inserted at ${Math.round(DocElWidth)} x ${Math.round(DocElHeight)}px to fit the document.`

                byId('submit').textContent= 'Insert'
                byId('submit').className= 'blue'
                byId('submit').disabled = false
            }



            byId('code').style.border = '';
        } catch (e) {

            const errorInfo = document.createElement('code')
            errorInfo.innerText = e.message

            byId('preview').innerHTML = ''
            byId('preview').appendChild(errorInfo)

            byId('code').style.border = '1px solid red';
            byId('submit').disabled = true

        }
    }, 100);

    const defaultContent = `graph LR
      A[Hard edge] -->|Link text| B(Round edge)
      B --> C{Decision}
      C -->|One| D[Result one]
      C -->|Two| E[Result two]
  `;

    function setCode(source) {
        byId('code').value = source || defaultContent;
        renderPreview();
    }


    async function submitGraph(e) {
        e.preventDefault();
        byId('submit').disabled = true
        byId('code').disabled = true
        byId('theme').disabled = true
        byId('frameBorderWidth').disabled = true
        byId('frameBorderColor').disabled = true
        byId('framePadding').disabled = true
        byId('cancel').disabled = true

        byId('form').removeEventListener('submit', submitGraph);

        applyFrameConfig(getFrameConfigFromInputs());
        persistFrameConfig().catch(error => console.error(error));

        let svg = document.getElementsByTagName('svg')[0];
        const targetTotalWidth = Number(window.graphDataFromGoogle?.currentWidth || 0);
        svgAsPng(svg, (base64, width, height) => {
            applyChanges( svg, byId('code').value, theme, base64, width, height);
        }, targetTotalWidth);
    }

    byId('cancel').addEventListener('click', e => {
        e.preventDefault();
        cancelEdit();
    });

    byId('theme').addEventListener('change', e => {
        theme = e.target.value;
        localStorage.setItem('favorite-theme', theme)
        renderPreview()
    });

    byId('frameBorderWidth').addEventListener('change', () => {
        persistFrameConfig().then(() => renderPreview()).catch(error => alert(error.message || String(error)));
    });
    byId('frameBorderColor').addEventListener('change', () => {
        persistFrameConfig().then(() => renderPreview()).catch(error => alert(error.message || String(error)));
    });
    byId('framePadding').addEventListener('change', () => {
        persistFrameConfig().then(() => renderPreview()).catch(error => alert(error.message || String(error)));
    });


    function applyChanges(svg,lastCorrectCode, theme, base64, width, height) {
        console.log(lastCorrectCode, base64);

        if (!window.google) {
            byId('preview').innerHTML=`<img alt="" src="${base64}"/>`
            // window.open(base64);
            return
        }

        window.google.script.run
            .withFailureHandler(msg =>
              alert(
                  msg+'\n\n'+
                '"Invalid image data" means the resulting image is too big, try to split up the chart\n'+
                '"Authorization is required" means your should log out of all other google accounts.'
              )
            )
            .withSuccessHandler(() => google.script.host.close())
            .withUserObject(this)
            .insertImage(lastCorrectCode,theme,  base64, width, height);
    }

    function cancelEdit() {
        if (!window.google) return;
        google.script.host.close();
    }

    async function setup(){
        try {

            const buttonLabel=window.graphDataFromGoogle?.label
            if (buttonLabel) {
                byId('submit').innerText = buttonLabel;
            }

            const source=window.graphDataFromGoogle?.source || ''
            theme=window.graphDataFromGoogle?.theme || localStorage.getItem('favorite-theme') || 'default'

            const savedFrame = await callServer('getImageFrameConfig');
            applyFrameConfig(savedFrame || FRAME_DEFAULTS);

            byId('theme').value = theme
            setCode(source);

            byId('code').addEventListener('keyup', () => renderPreview());
            byId('form').addEventListener('submit', submitGraph);

            mermaid.initialize({
                startOnLoad: false,
                theme,
            });



        } catch (e) {
            console.error(e);
            alert(e.message)
        }
    }
    setup()


      function supportTabIndentation(textarea) {
        const offsetToLineAndOffset = (lines, offset) => {
            let line = 0
            while (offset > lines[line].length && line < lines.length - 1) {
                offset = offset - lines[line].length - 1
                line++
            }
            return {line, offset}
        }
        const LineAndOffsetToOffset = (lines, line, offset) => {
            for (let i = 0; i < line; i++)
                offset += lines[i].length + 1

            return offset
        }

        function setContentWhileKeepingUndoStack(text){

                // textarea.value = lines.join('\n')
                  // focus and "type" the next number
                  textarea.focus();
                  document.execCommand('selectAll');
                  document.execCommand('insertText', false, text);
        }

        textarea.addEventListener('keydown', e => {
            if (e.key == 'Tab') {
                e.preventDefault()
                const lines = e.target.value.split('\n')

                const selection = [offsetToLineAndOffset(lines, textarea.selectionStart),
                    offsetToLineAndOffset(lines, textarea.selectionEnd)]
                for (var l = selection[0].line; l <= selection[1].line; l++) {
                    const originalLength = lines[l].length
                    if (e.shiftKey) {
                        lines[l] = lines[l].replace(/^ {0,4}/, '')
                    } else {
                        lines[l] = '    ' + lines[l]
                    }
                    // How much the line moved
                    const delta = lines[l].length - originalLength
                    // Update the user selection if it's on this line
                    selection.forEach((sel) => {
                        if (sel.line == l) {
                            sel.offset = Math.max(0, sel.offset + delta)
                        }
                    })
                }


                setContentWhileKeepingUndoStack(lines.join('\n'))
                textarea.selectionStart = LineAndOffsetToOffset(lines, selection[0].line, selection[0].offset)
                textarea.selectionEnd = LineAndOffsetToOffset(lines, selection[1].line, selection[1].offset)
            }
            if(e.key==='Enter'){
                const {selectionStart, selectionEnd, value}= textarea

                const linesBeforeCursor=value.slice(0,selectionStart).split('\n')
                const lastLine=linesBeforeCursor[linesBeforeCursor.length-1]
                const indentation=lastLine.match(/^\s+/)?.[0] || ''

                setContentWhileKeepingUndoStack(value.slice(0,selectionStart)+'\n'+indentation+value.slice(selectionEnd))
                textarea.selectionStart=selectionStart+1+indentation.length
                textarea.selectionEnd=textarea.selectionStart

                e.preventDefault()
            }
        })
    }

    supportTabIndentation(document.getElementById('code'))

</script>

<style>
    html,
    body {
        padding: 0;
        margin: 0;
        overflow: hidden;
    }

    #form {
        height: 100vh;
        width: 100vw;
        box-sizing: border-box;
        position: absolute;
        display: grid;
        grid-template-areas:
                "codelabel help preview  preview"
                "code code preview  preview"
            "theme frame info  buttons ";
        grid-template-columns:auto auto  1fr auto;
        grid-template-rows:auto 1fr auto ;
        gap:20px;
    }

#codelabel{grid-area: codelabel;}
#help{grid-area: help; text-align: right}
#code{grid-area: code;resize: horizontal; min-width: 200px; font-family: monospace;}
#theme{grid-area: theme;}
#frameControls{grid-area: frame;}
#preview{
    grid-area: preview;
    overflow: scroll;
}
#preview code{
    white-space: normal;
}

#buttons{grid-area: buttons; }
#info{grid-area: info; opacity: 0.8; max-width: 600px;   justify-self: flex-end;}

.frame-controls {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.frame-controls input[type="number"] {
    width: 68px;
}

.frame-controls input[type="color"] {
    width: 38px;
    height: 28px;
    padding: 0;
}



</style>
</body>
</html>
